name: Service and SQL verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check_ui.mjs
      - run: python -m pytest tests -q --junitxml=outputs/ci/unit_results.xml
      - run: python scripts/integration_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            outputs/ci/unit_results.xml
            outputs/integration_results.json
            outputs/ui_logic_results.json
